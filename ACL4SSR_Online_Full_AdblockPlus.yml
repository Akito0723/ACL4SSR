      - 🚀 手动切换
      - ♻️ 自动选择
      - 🇯🇵 日本节点
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇰🇷 韩国节点
      - 🇺🇲 美国节点
      - 🎯 全球直连

